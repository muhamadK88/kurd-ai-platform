name: Automated AI News

# Runs the Kurd AI news pipeline: scrape → fact-check (Gemini 2.5 Pro) →
# translate to Sorani + Badini → publish to the site.

on:
  schedule:
    # Every 2 hours, on the hour (UTC). GitHub cron is always UTC.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never let two runs publish the same feed items at once.
concurrency:
  group: automated-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run news pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBSITE_API_SECRET: ${{ secrets.WEBSITE_API_SECRET }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          NEWS_MAX_PER_RUN: "6"
        run: python scripts/news_pipeline.py
