name: Deploy to Hostinger

# Auto-deploy kurd-ai.com when code is pushed to main on GitHub.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-kurd-ai-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy files to Hostinger
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "."
          TARGET: "/home/u739214395/domains/kurd-ai.com/public_html/"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /.env, /.env.backup, /.env.production, /.env.key, /storage/logs/, /firebase_credentials.json, /.DS_Store"
          SCRIPT_AFTER: |
            cd /home/u739214395/domains/kurd-ai.com/public_html
            chmod +x scripts/deploy-server.sh
            bash scripts/deploy-server.sh "${{ secrets.LARAVEL_ENV_DECRYPT_KEY }}"
